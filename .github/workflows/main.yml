name: Build Custom Cam Acolyte

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install MinGW
      uses: egor-tisin/setup-mingw-gh-action@v1
      with:
        version: 12.2.0

    - name: Compile Custom App
      run: |
        g++ -O3 src/main.cpp src/games/sh_origins.cpp -o ps2_cam_acolyte_custom.exe -static -lws2_32

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ps2_cam_acolyte_custom
        path: ps2_cam_acolyte_custom.exe
