name: Build Custom Cam Acolyte

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Build Solution
      run: |
        $sln = (Get-ChildItem -Recurse -Filter "*.sln" | Select-Object -First 1).FullName
        if (-not $sln) { throw "Файл .sln не найден ни в одной папке!" }
        msbuild $sln /p:Configuration=Release /p:Platform=x64 /p:DebugType=None

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ps2_cam_acolyte_custom
        path: |
          **/x64/Release/
          **/Release/
